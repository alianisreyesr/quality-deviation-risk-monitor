name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────
  # 1. BACKEND — lint + type-check + tests + coverage
  # ──────────────────────────────────────────
  backend:
    name: Backend (Python 3.11)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint with ruff
        run: ruff check app/ tests/

      - name: Type-check with mypy
        run: mypy   # configured in mypy.ini (files = app)

      - name: Security lint with Bandit
        run: bandit -q -r app -ll

      - name: Audit dependencies with pip-audit
        run: pip-audit -r requirements-prod.txt --progress-spinner off

      - name: Run tests with coverage
        env:
          PYTHONPATH: .
        run: |
          pytest tests/ \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=85 \
            -v

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: coverage.xml

  # ──────────────────────────────────────────
  # 2. FRONTEND — reproducible install + production build
  # ──────────────────────────────────────────
  frontend:
    name: Frontend (Vite build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Audit dependencies
        run: npm audit --audit-level=high

  # ──────────────────────────────────────────
  # 3. DOCKER — build + /health smoke test
  # ──────────────────────────────────────────
  docker:
    name: Docker smoke test
    runs-on: ubuntu-latest
    needs: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build and start services
        run: docker compose up --build -d

      - name: Wait for API /health
        run: |
          echo "Waiting for /health..."
          for i in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/health 2>/dev/null || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "API healthy after ${i}s"
              break
            fi
            sleep 2
          done
          curl -f http://localhost:8000/health || (docker compose logs && exit 1)

      - name: Verify /health fields
        run: |
          RESP=$(curl -s http://localhost:8000/health)
          echo "$RESP"
          echo "$RESP" | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          assert data.get('status') == 'ok', f'Bad status: {data}'
          assert 'version' in data or 'service' in data, 'Missing identity field'
          print('Health check verified')
          "

      - name: Swagger UI accessible
        run: curl -f http://localhost:8000/docs > /dev/null

      - name: Print logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down
