services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      # Set ENVIRONMENT=production and a 32+ char JWT_SECRET_KEY (see .env.example)
      ENVIRONMENT: ${ENVIRONMENT:-development}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
      JWT_EXPIRES_MINUTES: ${JWT_EXPIRES_MINUTES:-60}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    volumes:
      # Named volume so the SQLite database (seeded on first boot from
      # data/*.csv) persists across restarts and is readable by the
      # metabase service below — see docs/dashboard.md.
      - quality-data:/app/data

  # Optional: initial BI dashboard over the same SQLite database the API
  # uses. Not required to run the API — start it with:
  #   docker compose --profile dashboard up --build
  # See docs/dashboard.md for the one-time SQLite driver setup and the
  # starter questions/dashboard to build once Metabase is up.
  metabase:
    image: metabase/metabase:v0.50.8
    profiles: ["dashboard"]
    ports:
      - "3000:3000"
    volumes:
      - quality-data:/data:ro
      - ./metabase-plugins:/plugins
      - metabase-app-db:/metabase-data
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
    depends_on:
      - api

volumes:
  quality-data:
  metabase-app-db:
